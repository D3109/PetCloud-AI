<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auditoría — PetCloud IA</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <p class="muted"><a href="admin.html">← Volver al panel de administración</a></p>
    <h1>Registro de auditoría</h1>
    <p class="muted">Acciones administrativas sensibles: creación de usuarios, cambios de rol, bloqueos y cambios en productos.</p>

    <div class="filters">
      <select id="audit-limit">
        <option value="100">Últimos 100</option>
        <option value="200" selected>Últimos 200</option>
        <option value="500">Últimos 500</option>
      </select>
      <button type="button" id="audit-refresh" class="btn-small">Actualizar</button>
      <span class="muted" id="audit-count"></span>
    </div>

    <p id="audit-state" class="muted">Cargando...</p>
    <table class="admin-table" id="audit-table" hidden>
      <thead>
        <tr><th>Fecha</th><th>Quién</th><th>Acción</th><th>Entidad</th><th>ID</th><th>Detalle</th></tr>
      </thead>
      <tbody id="audit-table-body"></tbody>
    </table>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/audit-log.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
