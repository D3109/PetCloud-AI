<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PetCloud — Catálogo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Catálogo de productos</h1>
    <div class="filters">
      <select id="filter-category">
        <option value="">Todas las categorías</option>
      </select>
      <select id="filter-pet-type">
        <option value="">Todas las mascotas</option>
        <option value="perro">Perro</option>
        <option value="gato">Gato</option>
        <option value="ambas">Ambas</option>
        <option value="otro">Otro</option>
      </select>
      <input id="filter-search" type="search" placeholder="Buscar producto..." />
    </div>
    <div id="product-grid" class="grid"></div>
  </main>
  <div id="product-modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="product-modal-content"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
