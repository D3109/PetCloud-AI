<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetCloud — Catálogo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="home-shell">
    <section class="hero">
      <div class="hero-text">
        <h1>Lo mejor para tu mascota,<br>en un click</h1>
        <p>Nuestra IA te recomienda qué comprar según tu perro o gato</p>
        <a href="#catalogo" class="hero-cta">Ver productos</a>
      </div>
      <div class="hero-image" id="hero-carousel" aria-hidden="true">
        <div class="hero-slide active">
        <svg viewBox="0 0 320 220" class="hero-illustration">
          <ellipse cx="108" cy="192" rx="80" ry="13" fill="rgba(0,0,0,0.10)"/>
          <ellipse cx="228" cy="194" rx="60" ry="11" fill="rgba(0,0,0,0.10)"/>

          <!-- destellos decorativos -->
          <g class="sparkle sparkle-1" fill="#fff">
            <path d="M28 46 L31 54 L39 57 L31 60 L28 68 L25 60 L17 57 L25 54 Z"/>
          </g>
          <g class="sparkle sparkle-2" fill="#fff">
            <path d="M300 118 L302 124 L308 126 L302 128 L300 134 L298 128 L292 126 L298 124 Z"/>
          </g>

          <!-- perro -->
          <g class="pet-dog">
            <ellipse cx="58" cy="93" rx="29" ry="38" fill="#dc9a4e" transform="rotate(-16 58 93)"/>
            <ellipse cx="150" cy="93" rx="29" ry="38" fill="#dc9a4e" transform="rotate(16 150 93)"/>
            <circle cx="104" cy="110" r="66" fill="#f2c27c"/>
            <ellipse cx="104" cy="148" rx="38" ry="30" fill="#faddab"/>
            <!-- mejillas sonrojadas -->
            <ellipse cx="72" cy="128" rx="11" ry="7" fill="#f3a9a0" opacity="0.65"/>
            <ellipse cx="136" cy="128" rx="11" ry="7" fill="#f3a9a0" opacity="0.65"/>
            <!-- ojos con brillo -->
            <circle cx="83" cy="100" r="7.5" fill="#3a2a1c"/>
            <circle cx="126" cy="100" r="7.5" fill="#3a2a1c"/>
            <circle cx="85.5" cy="97" r="2.2" fill="#fff"/>
            <circle cx="128.5" cy="97" r="2.2" fill="#fff"/>
            <!-- nariz y sonrisa (sin lengua) -->
            <ellipse cx="104" cy="139" rx="11" ry="8" fill="#3a2a1c"/>
            <path d="M104 147 L104 152" stroke="#3a2a1c" stroke-width="3" stroke-linecap="round"/>
            <path d="M90 156 Q104 166 118 156" stroke="#3a2a1c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>

          <!-- gato -->
          <g class="pet-cat">
            <polygon points="198,68 214,28 230,72" fill="#71798a"/>
            <polygon points="266,72 280,30 294,70" fill="#71798a"/>
            <polygon points="204,66 214,40 223,69" fill="#f3a9a0"/>
            <polygon points="270,69 280,44 288,68" fill="#f3a9a0"/>
            <circle cx="246" cy="112" r="56" fill="#7c8496"/>
            <ellipse cx="246" cy="144" rx="33" ry="25" fill="#939bac"/>
            <!-- mejillas sonrojadas -->
            <ellipse cx="216" cy="126" rx="10" ry="6.5" fill="#f3a9a0" opacity="0.55"/>
            <ellipse cx="276" cy="126" rx="10" ry="6.5" fill="#f3a9a0" opacity="0.55"/>
            <!-- ojos con brillo -->
            <circle cx="228" cy="104" r="6.5" fill="#f4e8b8"/>
            <circle cx="264" cy="104" r="6.5" fill="#f4e8b8"/>
            <circle cx="228" cy="104" r="3" fill="#20242c"/>
            <circle cx="264" cy="104" r="3" fill="#20242c"/>
            <circle cx="230" cy="101.5" r="1.3" fill="#fff"/>
            <circle cx="266" cy="101.5" r="1.3" fill="#fff"/>
            <!-- nariz y sonrisa -->
            <polygon points="246,126 241,133 251,133" fill="#e8667c"/>
            <path d="M233 138 Q246 148 259 138" stroke="#20242c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- bigotes -->
            <line x1="198" y1="128" x2="216" y2="124" stroke="#eef1f5" stroke-width="2" stroke-linecap="round"/>
            <line x1="198" y1="138" x2="216" y2="136" stroke="#eef1f5" stroke-width="2" stroke-linecap="round"/>
            <line x1="294" y1="128" x2="276" y2="124" stroke="#eef1f5" stroke-width="2" stroke-linecap="round"/>
            <line x1="294" y1="138" x2="276" y2="136" stroke="#eef1f5" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
        </div>
      </div>
    </section>

    <section class="category-row" aria-label="Categorías rápidas">
      <a class="category-item" href="index.html?mascota=gato">
        <span class="category-circle">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <polygon points="14,22 22,8 26,24" fill="#fff"/>
            <polygon points="50,22 42,8 38,24" fill="#fff"/>
            <circle cx="32" cy="34" r="20" fill="#fff"/>
            <circle cx="24" cy="32" r="2.6" fill="var(--color-primary)"/>
            <circle cx="40" cy="32" r="2.6" fill="var(--color-primary)"/>
            <path d="M28 40 Q32 44 36 40" stroke="var(--color-primary)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <line x1="6" y1="36" x2="18" y2="34" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="42" x2="18" y2="40" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <line x1="58" y1="36" x2="46" y2="34" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <line x1="58" y1="42" x2="46" y2="40" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="category-label">Gatos</span>
      </a>
      <a class="category-item" href="index.html?mascota=perro">
        <span class="category-circle">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <ellipse cx="14" cy="28" rx="8" ry="14" fill="#fff" transform="rotate(-20 14 28)"/>
            <ellipse cx="50" cy="28" rx="8" ry="14" fill="#fff" transform="rotate(20 50 28)"/>
            <circle cx="32" cy="32" r="18" fill="#fff"/>
            <ellipse cx="32" cy="42" rx="10" ry="8" fill="#fff"/>
            <circle cx="24" cy="28" r="2.6" fill="var(--color-primary)"/>
            <circle cx="40" cy="28" r="2.6" fill="var(--color-primary)"/>
            <ellipse cx="32" cy="40" rx="4" ry="3" fill="var(--color-primary)"/>
          </svg>
        </span>
        <span class="category-label">Perros</span>
      </a>
      <a class="category-item" href="index.html#catalogo">
        <span class="category-circle">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="18" y="28" width="28" height="8" rx="4" fill="#fff"/>
            <circle cx="14" cy="24" r="7" fill="#fff"/>
            <circle cx="14" cy="40" r="7" fill="#fff"/>
            <circle cx="50" cy="24" r="7" fill="#fff"/>
            <circle cx="50" cy="40" r="7" fill="#fff"/>
          </svg>
        </span>
        <span class="category-label">Juguetes</span>
      </a>
    </section>

    <div id="weather-tip" class="weather-tip hidden"></div>
  </div>
  <main id="catalogo">
      <h2 class="section-title">Catálogo de productos</h2>
      <div class="filters">
        <select id="filter-category">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filter-pet-type">
          <option value="">Todas las mascotas</option>
          <option value="perro">Perro</option>
          <option value="gato">Gato</option>
          <option value="ambas">Ambas</option>
          <option value="otro">Otro</option>
        </select>
        <input id="filter-search" type="search" placeholder="Buscar por nombre, marca o descripción..." />
        <div class="price-filter">
          <input id="filter-price-min" type="number" min="0" step="1000" placeholder="Precio mín." />
          <span class="price-filter-sep">—</span>
          <input id="filter-price-max" type="number" min="0" step="1000" placeholder="Precio máx." />
        </div>
        <button type="button" id="filter-clear" class="btn-small">Limpiar filtros</button>
      </div>
      <div id="product-grid" class="grid"></div>
    </main>
  <div id="product-modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="product-modal-content"></div>
  </div>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/weather-tip.js"></script>
  <script src="js/hero-carousel.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
