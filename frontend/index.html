<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PetCloud — Catálogo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <section class="hero">
    <span class="hero-deco hero-deco-left" aria-hidden="true">🐾</span>
    <span class="hero-deco hero-deco-right" aria-hidden="true">🐾</span>
    <div class="hero-inner">
      <h1>Todo para tu mascota, en un solo lugar</h1>
      <p>Alimento, juguetes, higiene, salud y medicamentos — con recomendaciones de IA pensadas para tu perro o gato.</p>
      <div class="hero-badges">
        <span>🤖 Recomendaciones con IA</span>
        <span>🚚 Seguimiento de pedidos</span>
        <span>💊 Ahora con Medicamentos</span>
      </div>
    </div>
  </section>
  <main>
    <h2 class="section-title">Catálogo de productos</h2>
    <div class="filters">
      <select id="filter-category">
        <option value="">Todas las categorías</option>
      </select>
      <select id="filter-pet-type">
        <option value="">Todas las mascotas</option>
        <option value="perro">Perro</option>
        <option value="gato">Gato</option>
        <option value="ambas">Ambas</option>
        <option value="otro">Otro</option>
      </select>
      <input id="filter-search" type="search" placeholder="Buscar por nombre, marca o descripción..." />
      <div class="price-filter">
        <input id="filter-price-min" type="number" min="0" step="1000" placeholder="Precio mín." />
        <span class="price-filter-sep">—</span>
        <input id="filter-price-max" type="number" min="0" step="1000" placeholder="Precio máx." />
      </div>
      <button type="button" id="filter-clear" class="btn-small">Limpiar filtros</button>
    </div>
    <div id="product-grid" class="grid"></div>
  </main>
  <div id="product-modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="product-modal-content"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
