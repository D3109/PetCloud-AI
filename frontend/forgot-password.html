<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PetCloud — Recuperar contraseña</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="auth-page">
    <aside class="auth-visual">
      <div class="auth-visual-inner">
        <span class="auth-visual-emoji">🔑</span>
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Tranquilo, le pasa a cualquiera. Escribe tu correo y te enviamos un enlace para crear una nueva.</p>
        <ul class="auth-visual-points">
          <li>✓ El enlace es válido por 30 minutos</li>
          <li>✓ Solo tú puedes usarlo</li>
          <li>✓ Si no fuiste tú, puedes ignorar el correo</li>
        </ul>
      </div>
    </aside>
    <main class="auth-box">
      <h1>Recuperar contraseña</h1>
      <form id="forgot-form">
        <input type="email" id="forgot-email" placeholder="Correo electrónico" required />
        <button type="submit">Enviar enlace</button>
        <p id="forgot-error" class="error"></p>
        <p id="forgot-success" class="success"></p>
      </form>
      <p class="auth-switch"><a href="login.html">Volver a Ingresar</a></p>
    </main>
  </div>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/forgot-password.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
