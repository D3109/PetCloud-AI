<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PetCloud — Restablecer contraseña</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="auth-page">
    <aside class="auth-visual">
      <div class="auth-visual-inner">
        <span class="auth-visual-emoji">🔒</span>
        <h2>Crea una nueva contraseña</h2>
        <p>Elige una contraseña segura: mínimo 8 caracteres, con al menos una letra y un número.</p>
      </div>
    </aside>
    <main class="auth-box">
      <h1>Restablecer contraseña</h1>
      <form id="reset-form">
        <input type="text" id="reset-token" placeholder="Código del correo" required />
        <p class="muted small">Pégalo aquí si no se completó solo desde el enlace del correo.</p>
        <input type="password" id="reset-password" placeholder="Nueva contraseña" required />
        <input type="password" id="reset-password-confirm" placeholder="Confirmar nueva contraseña" required />
        <button type="submit">Restablecer contraseña</button>
        <p id="reset-error" class="error"></p>
        <p id="reset-success" class="success"></p>
      </form>
      <p class="auth-switch"><a href="login.html">Volver a Ingresar</a></p>
    </main>
  </div>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/reset-password.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
